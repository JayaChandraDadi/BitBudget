[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitbudget"
version = "0.1.0"
description = "Salience-guided mixed-precision quantization for on-device LLMs on Apple silicon (MLX)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jaya Chandra Dadi" }]
dependencies = [
    "mlx>=0.29",
    "mlx-lm>=0.28",
    "numpy",
    "matplotlib",
    "datasets",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bitbudget = "bitbudget.cli:main"

[tool.setuptools.packages.find]
include = ["bitbudget*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
